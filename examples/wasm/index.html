<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneOCR · WebAssembly</title>
<style>
  body{font:16px/1.6 system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#192936;background:#f6f8fa}
  h1{font-size:26px}button,input{font:inherit}button{padding:6px 18px;margin:8px 8px 8px 0;cursor:pointer}button:disabled{cursor:default}
  #preview{display:block;max-width:100%;max-height:400px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #d5dfe6;border-radius:8px;padding:18px}summary{cursor:pointer}
</style>
<h1>OneOCR · WebAssembly</h1>
<p>在浏览器本地识别。首次加载约 125 MiB 模型；识别期间可以取消。图像不会上传到 OCR 服务。</p>
<input id="image" type="file" accept="image/*" aria-label="选择待识别图片">
<div><button id="run" disabled>识别</button><button id="cancel" disabled>取消</button></div>
<p id="status" role="status">请选择图片。</p>
<img id="preview" hidden alt="待识别图片预览">
<pre id="text" aria-label="识别文字"></pre>
<details><summary>完整 JSON（含行词四边形、置信度、方向及手写类型）</summary><pre id="json"></pre></details>
<script type="module">
import { createOneOcrWorker } from '../../artifacts/wasm32/worker-client.mjs';
const image = document.querySelector('#image'), run = document.querySelector('#run');
const cancel = document.querySelector('#cancel'), status = document.querySelector('#status');
const text = document.querySelector('#text'), json = document.querySelector('#json'), preview = document.querySelector('#preview');
let engine, controller, previewUrl, busy = false;
image.onchange = () => {
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  const file = image.files[0];
  preview.hidden = !file;
  if (file) preview.src = previewUrl = URL.createObjectURL(file);
  run.disabled = busy || !file;
};
cancel.onclick = () => controller?.abort();
run.onclick = async () => {
  const file = image.files[0];
  if (!file || busy) return;
  busy = true; run.disabled = true; image.disabled = true; cancel.disabled = false;
  text.textContent = ''; json.textContent = '';
  const began = performance.now();
  try {
    if (!engine) {
      controller = new AbortController();
      status.textContent = '正在加载本地模型…';
      engine = await createOneOcrWorker({ modelBaseUrl: new URL('../../models/', import.meta.url), signal: controller.signal, timeoutMs: 600000 });
    }
    status.textContent = '正在识别…';
    const result = await engine.recognize(await file.arrayBuffer(), { fileName: file.name });
    text.textContent = result.lines.map(line => line.text).join('\n');
    json.textContent = JSON.stringify(result, null, 2);
    status.textContent = `完成：${result.line_count} 行，用时 ${((performance.now()-began)/1000).toFixed(1)} 秒。`;
  } catch (error) {
    engine?.terminate(); engine = undefined;
    status.textContent = controller?.signal.aborted ? '已取消。' : `失败${typeof error.code === 'number' ? ` (${error.code})` : ''}：${error.message}`;
  } finally {
    busy = false; run.disabled = !image.files[0]; image.disabled = false; cancel.disabled = true;
  }
};
addEventListener('pagehide', () => { engine?.terminate(); if (previewUrl) URL.revokeObjectURL(previewUrl); });
</script>
</html>
